services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: requests }
    healthcheck: { test: ["CMD-SHELL","pg_isready -U app -d requests"], interval: 3s, retries: 20 }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    ports: ["3001:3000"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/requests
      JWT_SECRET: change-me-in-production
      SEED_PASSWORD: Passw0rd123
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
